<!DOCTYPE html>
<html lang="en">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里追踪器</title>

<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #111;
    }

    .topbar {
        position: sticky;
        top: 0;
        background: white;
        padding: 12px;
        text-align: center;
        font-weight: 600;
        border-bottom: 1px solid #ddd;
        z-index: 10;
    }

    .summary {
        background: white;
        margin: 10px;
        padding: 15px;
        border-radius: 14px;
        text-align: center;
        font-size: 18px;
    }

    .nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        background: white;
        border-top: 1px solid #ddd;
    }

    .nav button {
        flex: 1;
        padding: 14px;
        border: none;
        background: none;
        font-size: 14px;
    }

    .nav button.active {
        color: #007aff;
        font-weight: 600;
    }

    .page {
        display: none;
        padding: 10px;
        padding-bottom: 80px;
    }

    .page.active {
        display: block;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 14px;
        margin: 10px 0;
    }

    input {
        width: 100%;
        padding-top: 10px;
        padding-bottom: 10px;
        margin: 6px 0;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-size: 16px;
    }

    button.action {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: none;
        background: #007aff;
        color: white;
        font-size: 16px;
        margin-top: 6px;
    }

    .quick {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
    }

    .quick button {
        flex: 1;
        min-width: 45%;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid #ddd;
        background: #f9f9f9;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
        align-items: center;
    }

    .delete {
        background: #ff3b30;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
    }

    /* MEAL TABS */
    .meal-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
    }

    .meal-tabs button {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ddd;
        background: #f9f9f9;
    }

    .meal-tabs button.active {
        background: #007aff;
        color: white;
        border: none;
    }

    .goal-container {
        width: 100%;
        height: 14px;
        background: #e5e5ea;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 12px;
    }

    .goal-fill {
        height: 100%;
        width: 0%;
        background: #34c759;
        transition: width 0.3s ease;
    }

    #goalText {
        margin-top: 8px;
        font-size: 14px;
        color: #666;
    }

    .date-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
    }

    .date-nav button {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 10px;
        background: #007aff;
        color: white;
        font-size: 16px;
    }

    .date-nav input {
        flex: 1;
        margin: 0;
    }

    .today-btn {
        border: none;
        border-radius: 10px;
        background: #f2f2f7;
        padding: 8px 12px;
        margin-bottom: 10px;
    }

    .date-label {
        font-weight: 600;
        margin-bottom: 10px;
    }
</style>
</head>

<body>

<div class="topbar">卡路里追踪器</div>

<div class="summary">

    <div class="date-nav">
        <button onclick="changeDate(-1)">◀</button>

        <input
            type="date"
            id="datePicker"
            onchange="jumpToDate()"
        >

        <button onclick="changeDate(1)">▶</button>
    </div>

    <button class="today-btn" onclick="goToToday()">
        Today
    </button>

    <div class="date-label">
        <span id="date"></span>
    </div>

    <!-- <hr>

    Goal:
    <span id="goalDisplay">1800</span> kcal -->
</div>

<!-- HOME -->
<div id="home" class="page active">

    <div class="card">
        <h3>体重</h3>
        <input id="weightInput" type="number" step="0.1" placeholder="kg">
        <button class="action" onclick="saveWeight()">记录</button>
        <div>今天的体重: <span id="weightDisplay">-</span></div>
    </div>

    <div class="card">
        <h3>总结</h3>
        热量摄入: <span id="intake-total">0</span> kcal<br>
        热量消耗: <span id="activity-total">0</span> kcal<br>
        净热量: <span id="net-total">0</span> kcal<br>
        <div class="goal-container">
            <div class="goal-fill" id="goalFill"></div>
        </div>
        <div id="goalText">
            剩 1800 kcal 
        </div>
        体重: <span id="weightDisplaySummary">-</span>

        <!-- <div class="quick">
            <button onclick="quick('breakfast','Banana',105)">Banana</button>
            <button onclick="quick('breakfast','Eggs',180)">Eggs</button>
            <button onclick="quick('lunch','Chicken Rice',650)">Chicken Rice</button>
            <button onclick="quick('dinner','Rice + Chicken',700)">Rice + Chicken</button>
        </div> -->
    </div>

</div>

<!-- MEALS -->
<div id="meals" class="page">

    <div class="card">
        <h3>餐</h3>

        <!-- TABS -->
        <div class="meal-tabs">
            <button onclick="setMeal('breakfast')" class="active">早餐</button>
            <button onclick="setMeal('lunch')">午餐</button>
            <button onclick="setMeal('dinner')">晚餐</button>
            <button onclick="setMeal('snack')">零食</button>
        </div>

        <input id="food" placeholder="食物名称">
        <input id="cal" type="number" placeholder="卡路里">

        <button class="action" onclick="add()">记录</button>

        <button class="action" onclick="openCamera()" disabled>
            <!-- 📷 -->🚧
        </button>
        <input
            id="foodPhoto"
            type="file"
            accept="image/*"
            capture="environment"
            style="display:none"
            onchange="photoSelected(event)"
        >
        <img
            id="photoPreview"
            style="
                display:none;
                width:100%;
                border-radius:12px;
                margin-top:10px;
            "
        >

        <div class="quick">
            <button onclick="quick_from_meal('Banana',105)">香蕉</button>
            <button onclick="quick_from_meal('teriyaki Chicken 饭团',179)">Teriyaki Chicken 饭团</button>
            <button onclick="quick_from_meal('kani mayo 三明治',249)">Kani Mayo 三明治</button>
            <button onclick="quick_from_meal('chicken caesar wrap',264)">Chicken Caesar Wrap</button>
        </div>

        <ul id="list"></ul>
    </div>

</div>

<!-- CALORIES BURNT -->
<div id="calories-lost" class="page">

    <div class="card">
        <h3>打了几场mai</h3>
        <input id="caloriesInput" type="number" placeholder="次数">
        <button class="action" onclick="saveGamesPlayed()">记录</button>
    </div>


    <div class="card">
        <h3>算法</h3>
        <h4>一首13-14+大概消耗的卡路里：20-25 kcal</h4>
        <h4>一场solo mai大概消耗的卡路里：60-75 kcal</h4>
        <h4>一场双人mai大概消耗的卡路里：80-100 kcal</h4>
    </div>
    <!-- <div class="card">
        <h3>Quick Add</h3>
    </div> -->

</div>

<!-- STATS -->
<div id="stats" class="page">
    <div class="card">
        <h3>体重趋势</h3>
        <!-- <canvas id="chart"></canvas> -->
        <h4>Under Construction 🚧</h4>
        <h4> 被修理中 🚧</h4>
         <!-- <div id="myPlot" style="width:100%;"></div> -->
    </div>
</div>

<!-- NAV -->
<div class="nav">
    <button onclick="show('home')" class="active">Home</button>
    <button onclick="show('meals')">Meals</button>
    <button onclick="show('calories-lost')">Calories Lost</button>
    <button onclick="show('stats')">Stats</button>
</div>

<script>
const DEFAULT_GOAL = 1800;
const KEY = "tracker";

function getTodayString() {
    return new Date().toISOString().split("T")[0];
}

function emptyDay() {
    return {
        weight: null,

        breakfast: [],
        lunch: [],
        dinner: [],
        snack: [],

        activity: []
    };
}

let selectedDate = getTodayString();

document.getElementById("date").textContent = selectedDate;

let data = {};
let day = emptyDay();

let activeMeal = "breakfast";

/* ---------- LOAD ---------- */

function load(){

    const s = localStorage.getItem(KEY);

    if(s){
        data = JSON.parse(s);
    }

    loadDate(selectedDate);
}

function save(){

    data[selectedDate] = day;

    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );
}

/* ---------- WEIGHT ---------- */

function saveWeight(){
    const w = parseFloat(document.getElementById("weightInput").value);
    if(!w) return;
    day.weight = w;
    save();
    render();
}

function saveGamesPlayed(){
    field = document.getElementById("caloriesInput");
    if(!field || field.value === "") return;
    const games = parseFloat(document.getElementById("caloriesInput").value);
    day["activity"][0] ={activity:"mai", count:games, calories:games*70};
    // day["activity"].push({activity:"mai", count:games, calories:games*70}); // assuming average 70 kcal per game
    save();
    field.value = "";
    render();
    
}

/* ---------- QUICK ---------- */

function quick(meal, food, cal){
    day[meal].push({food, calories:cal});
    save();
    render();
}

function quick_from_meal(food, cal){
    day[activeMeal].push({food:food, calories:cal});

    save();
    render();
}

/* ---------- MEAL TABS ---------- */

function setMeal(meal){
    activeMeal = meal;

    document.querySelectorAll(".meal-tabs button")
        .forEach(b => b.classList.remove("active"));

    event.target.classList.add("active");

    renderMeal();
}

/* ---------- ADD ---------- */

function add(){
    const f = document.getElementById("food").value;
    const c = parseInt(document.getElementById("cal").value);

    if(!f || !c) return;

    day[activeMeal].push({food:f, calories:c});

    document.getElementById("food").value = "";
    document.getElementById("cal").value = "";

    save();
    render();
}

function openCamera() {
    document.getElementById("foodPhoto").click();
}

function photoSelected(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        const preview =
            document.getElementById("photoPreview");

        preview.src = e.target.result;
        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
}

/* ---------- DELETE ---------- */

function deleteEntry(meal, index){
    day[meal].splice(index, 1);
    save();
    render();
}

/* ---------- RENDER ---------- */


function render(){
    renderMeal();
    renderSummary();
}

function renderSummary(){

    document.getElementById("weightDisplay").textContent =
        day.weight ? day.weight + " kg" : "-";

    document.getElementById("weightDisplaySummary").textContent =
        day.weight ? day.weight + " kg" : "-";

    let total = 0;
    for(let m of ["breakfast","lunch","dinner","snack"]){
        day[m].forEach(x => total += x.calories);
    }

    const goal = DEFAULT_GOAL;
    const net = total - (day.activity && day.activity.length > 0 ? day.activity[0].calories : 0);

    document.getElementById("intake-total").textContent = total;
    document.getElementById("activity-total").textContent = day.activity && day.activity.length > 0 ? day.activity[0].calories : 0;
    document.getElementById("net-total").textContent = net;

    const percent = Math.min(100, Math.max(0, (net / goal) * 100));
    document.getElementById("goalFill").style.width = `${percent}%`;
    if (net < goal && net < goal/2) {
        document.getElementById("goalFill").style.background = "#ff3b30"; // red if not over goal
        document.getElementById("goalText").textContent = `剩 ${goal - net} kcal`;
    } else if (net < goal) {
        document.getElementById("goalFill").style.background = "#ff9500"; // red if not over goal
        document.getElementById("goalText").textContent = `剩 ${goal - net} kcal`;
    }
    else {
        document.getElementById("goalFill").style.background = "#34c759"; // green if over goal
        document.getElementById("goalText").textContent ="Goal reached ✓";
    }

}

function renderMeal(){

    const list = document.getElementById("list");
    list.innerHTML = "";

    day[activeMeal].forEach((x,i)=>{
        const li = document.createElement("li");
        li.innerHTML = `
            <div>
                <div>${x.food}</div>
                <small>${x.calories} kcal</small>
            </div>
            <button class="delete" onclick="deleteEntry('${activeMeal}',${i})">X</button>
        `;
        list.appendChild(li);
    });
}

/* ---------- NAV ---------- */

function show(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
    event.target.classList.add("active");

    if(id === "stats") draw();
}

/* ---------- GRAPH ---------- */

function draw(){

    const c = document.getElementById("chart");
    const ctx = c.getContext("2d");

    const arr = [];
    for(let d in data){
        if(data[d].weight) arr.push({d, w:data[d].weight});
    }

    arr.sort((a,b)=>new Date(a.d)-new Date(b.d));

    c.width = c.offsetWidth;
    c.height = 250;

    ctx.clearRect(0,0,c.width,c.height);

    if(arr.length<2) return;

    const pad = 20;
    const max = Math.max(...arr.map(x=>x.w));
    const min = Math.min(...arr.map(x=>x.w));

    const step = (c.width-pad*2)/(arr.length-1);

    ctx.beginPath();
    ctx.strokeStyle="#007aff";

    arr.forEach((x,i)=>{
        const px = pad + i*step;
        const py = c.height-pad - ((x.w-min)/(max-min||1))*(c.height-pad*2);

        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    });

    ctx.stroke();
}

function formatDateDisplay(dateString){

    const date = new Date(dateString);

    return date.toLocaleDateString(
        undefined,
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );
}

function updateDateUI(){

    document.getElementById("date").textContent =
        formatDateDisplay(selectedDate);

    document.getElementById("datePicker").value =
        selectedDate;
}

function changeDate(days){

    const d = new Date(selectedDate);

    d.setDate(d.getDate() + days);

    selectedDate =
        d.toISOString().split("T")[0];

    loadDate(selectedDate);
}

function jumpToDate(){

    selectedDate =
        document.getElementById("datePicker").value;

    loadDate(selectedDate);
}

function goToToday(){

    selectedDate = getTodayString();

    loadDate(selectedDate);
}

function loadDate(dateString){

    if(!data[dateString]){
        data[dateString] = emptyDay();
    }

    day = data[dateString];

    updateDateUI();
    render();
}

load();

</script>
