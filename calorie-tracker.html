<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里追踪器</title>

<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #111;
    }

    .topbar {
        position: sticky;
        top: 0;
        background: white;
        padding: 12px;
        text-align: center;
        font-weight: 600;
        border-bottom: 1px solid #ddd;
        z-index: 10;
    }

    .summary {
        background: white;
        margin: 10px;
        padding: 15px;
        border-radius: 14px;
        text-align: center;
        font-size: 18px;
    }

    .nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        background: white;
        border-top: 1px solid #ddd;
    }

    .nav button {
        flex: 1;
        padding: 14px;
        border: none;
        background: none;
        font-size: 14px;
    }

    .nav button.active {
        color: #007aff;
        font-weight: 600;
    }

    .page {
        display: none;
        padding: 10px;
        padding-bottom: 80px;
    }

    .page.active {
        display: block;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 14px;
        margin: 10px 0;
    }

    input {
        width: 100%;
        padding-top: 10px;
        padding-bottom: 10px;
        margin: 6px 0;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-size: 16px;
    }

    button.action {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: none;
        background: #007aff;
        color: white;
        font-size: 16px;
        margin-top: 6px;
    }

    .quick {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
    }

    .quick button {
        flex: 1;
        min-width: 45%;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid #ddd;
        background: #f9f9f9;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
        align-items: center;
    }

    .delete {
        background: #ff3b30;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
    }

    /* MEAL TABS */
    .meal-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
    }

    .meal-tabs button {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ddd;
        background: #f9f9f9;
    }

    .meal-tabs button.active {
        background: #007aff;
        color: white;
        border: none;
    }
</style>
</head>

<body>

<div class="topbar">卡路里追踪器</div>

<div class="summary">
    日期: <span id="date"></span><br>
    热量摄入: <span id="intake-total">0</span> kcal<br>
    热量消耗: <span id="activity-total">0</span> kcal<br>
    净热量: <span id="net-total">0</span> kcal<br>
    体重: <span id="weightDisplay">-</span>
</div>

<!-- HOME -->
<div id="home" class="page active">

    <div class="card">
        <h3>体重</h3>
        <input id="weightInput" type="number" step="0.1" placeholder="kg">
        <button class="action" onclick="saveWeight()">记录</button>
        <div>今天的体重: <span id="weightDisplay">-</span></div>
    </div>

    <div class="card">
        <h3>总结</h3>

        <!-- <div class="quick">
            <button onclick="quick('breakfast','Banana',105)">Banana</button>
            <button onclick="quick('breakfast','Eggs',180)">Eggs</button>
            <button onclick="quick('lunch','Chicken Rice',650)">Chicken Rice</button>
            <button onclick="quick('dinner','Rice + Chicken',700)">Rice + Chicken</button>
        </div> -->
    </div>

</div>

<!-- MEALS -->
<div id="meals" class="page">

    <div class="card">
        <h3>餐</h3>

        <!-- TABS -->
        <div class="meal-tabs">
            <button onclick="setMeal('breakfast')" class="active">早餐</button>
            <button onclick="setMeal('lunch')">午餐</button>
            <button onclick="setMeal('dinner')">晚餐</button>
            <button onclick="setMeal('snack')">零食</button>
        </div>

        <input id="food" placeholder="食物名称">
        <input id="cal" type="number" placeholder="卡路里">

        <button class="action" onclick="add()">记录</button>

        <div class="quick">
            <button onclick="quick_from_meal('Banana',105)">香蕉</button>
            <button onclick="quick_from_meal('teriyaki Chicken 饭团',179)">Teriyaki Chicken 饭团</button>
            <button onclick="quick_from_meal('kani mayo 三明治',249)">Kani Mayo 三明治</button>
            <button onclick="quick_from_meal('chicken caesar wrap',264)">Chicken Caesar Wrap</button>
        </div>

        <ul id="list"></ul>
    </div>

</div>

<!-- CALORIES BURNT -->
<div id="calories-lost" class="page">

    <div class="card">
        <h3>打了几场mai</h3>
        <input id="caloriesInput" type="number" placeholder="次数">
        <button class="action" onclick="saveGamesPlayed()">记录</button>
    </div>


    <div class="card">
        <h3>算法</h3>
        <h4>一首13-14+大概消耗的卡路里：20-25 kcal</h4>
        <h4>一场solo mai大概消耗的卡路里：60-75 kcal</h4>
        <h4>一场双人mai大概消耗的卡路里：80-100 kcal</h4>
    </div>
    <!-- <div class="card">
        <h3>Quick Add</h3>
    </div> -->

</div>

<!-- STATS -->
<div id="stats" class="page">
    <div class="card">
        <h3>体重趋势</h3>
        <canvas id="chart"></canvas>
    </div>
</div>

<!-- NAV -->
<div class="nav">
    <button onclick="show('home')" class="active">Home</button>
    <button onclick="show('meals')">Meals</button>
    <button onclick="show('calories-lost')">Calories Lost</button>
    <button onclick="show('stats')">Stats</button>
</div>

<script>

const KEY = "tracker";
const today = new Date().toISOString().split("T")[0];

document.getElementById("date").textContent = today;

let data = {};
let day = { weight:null, breakfast:[], lunch:[], dinner:[], snack:[], activity:[] };

let activeMeal = "breakfast";

/* ---------- LOAD ---------- */

function load(){
    const s = localStorage.getItem(KEY);
    if(s) data = JSON.parse(s);

    if(!data[today]){
        data[today] = { weight:null, breakfast:[], lunch:[], dinner:[], snack:[], activity:[] };
    }

    day = data[today];
    render();
}

function save(){
    data[today] = day;
    localStorage.setItem(KEY, JSON.stringify(data));
}

/* ---------- WEIGHT ---------- */

function saveWeight(){
    const w = parseFloat(document.getElementById("weightInput").value);
    if(!w) return;
    day.weight = w;
    save();
    render();
}

function saveGamesPlayed(){
    const games = parseFloat(document.getElementById("caloriesInput").value);
    if(!games) return;
    day["activity"][0] ={activity:"mai", count:games, calories:games*70};
    // day["activity"].push({activity:"mai", count:games, calories:games*70}); // assuming average 70 kcal per game
    save();
    render();
}
saveGamesPlayed

/* ---------- QUICK ---------- */

function quick(meal, food, cal){
    day[meal].push({food, calories:cal});
    save();
    render();
}

function quick_from_meal(food, cal){
    day[activeMeal].push({food:food, calories:cal});

    save();
    renderMeal();
    renderSummary();
}

/* ---------- MEAL TABS ---------- */

function setMeal(meal){
    activeMeal = meal;

    document.querySelectorAll(".meal-tabs button")
        .forEach(b => b.classList.remove("active"));

    event.target.classList.add("active");

    renderMeal();
}

/* ---------- ADD ---------- */

function add(){
    const f = document.getElementById("food").value;
    const c = parseInt(document.getElementById("cal").value);

    if(!f || !c) return;

    day[activeMeal].push({food:f, calories:c});

    document.getElementById("food").value = "";
    document.getElementById("cal").value = "";

    save();
    renderMeal();
    renderSummary();
}

/* ---------- DELETE ---------- */

function deleteEntry(meal, index){
    day[meal].splice(index, 1);
    save();
    renderMeal();
    renderSummary();
}

/* ---------- RENDER ---------- */

function render(){
    renderMeal();
    renderSummary();
}

function renderSummary(){

    document.getElementById("weightDisplay").textContent =
        day.weight ? day.weight + " kg" : "-";

    let total = 0;
    for(let m of ["breakfast","lunch","dinner","snack"]){
        day[m].forEach(x => total += x.calories);
    }

    document.getElementById("intake-total").textContent = total;
    document.getElementById("activity-total").textContent = day.activity.length > 0 ? day.activity[0].calories : 0;
    document.getElementById("net-total").textContent = total - (day.activity.length > 0 ? day.activity[0].calories : 0);

}

function renderMeal(){

    const list = document.getElementById("list");
    list.innerHTML = "";

    day[activeMeal].forEach((x,i)=>{
        const li = document.createElement("li");
        li.innerHTML = `
            <div>
                <div>${x.food}</div>
                <small>${x.calories} kcal</small>
            </div>
            <button class="delete" onclick="deleteEntry('${activeMeal}',${i})">X</button>
        `;
        list.appendChild(li);
    });
}

/* ---------- NAV ---------- */

function show(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
    event.target.classList.add("active");

    if(id === "stats") draw();
}

/* ---------- GRAPH ---------- */

function draw(){

    const c = document.getElementById("chart");
    const ctx = c.getContext("2d");

    const arr = [];
    for(let d in data){
        if(data[d].weight) arr.push({d, w:data[d].weight});
    }

    arr.sort((a,b)=>new Date(a.d)-new Date(b.d));

    c.width = c.offsetWidth;
    c.height = 250;

    ctx.clearRect(0,0,c.width,c.height);

    if(arr.length<2) return;

    const pad = 20;
    const max = Math.max(...arr.map(x=>x.w));
    const min = Math.min(...arr.map(x=>x.w));

    const step = (c.width-pad*2)/(arr.length-1);

    ctx.beginPath();
    ctx.strokeStyle="#007aff";

    arr.forEach((x,i)=>{
        const px = pad + i*step;
        const py = c.height-pad - ((x.w-min)/(max-min||1))*(c.height-pad*2);

        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    });

    ctx.stroke();
}

load();

</script>

</body>
</html>
