<script>
  const difficulties = ["basic", "advanced", "expert", "master", "remaster"];
  const labels = ["BASIC", "ADVANCED", "EXPERT", "MASTER", "Re:MASTER"];

  let current = 0;

  const container = document.getElementById("main-container");
  const label = document.getElementById("diff-label");

  function updateDifficulty() {
    container.className = "container " + difficulties[current];
    label.textContent = labels[current];
  }

  document.getElementById("diff-up").onclick = () => {
    current = (current + 1) % difficulties.length;
    updateDifficulty();
  };

  document.getElementById("diff-down").onclick = () => {
    current = (current - 1 + difficulties.length) % difficulties.length;
    updateDifficulty();
  };

  function scrollCarousel(direction) {
    const carousel = document.getElementById("carousel");
    if (!carousel) return;

    const scrollAmount = carousel.clientWidth * 0.65;
    carousel.scrollBy({
      left: scrollAmount * direction,
      behavior: "smooth"
    });
  }
</script>
